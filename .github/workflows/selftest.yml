name: Self-test

# Runs the logic, web-source, second-reading, missing-input and access-control self-test on every push and pull request.
# No API keys or internet services are used: the test uses the fictional sample report and local test sites only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile every module
        run: python -m compileall -q app.py core tools
      - name: Self-test
        run: python tools/selftest.py
