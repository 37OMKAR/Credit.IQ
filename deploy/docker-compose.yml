version: '3.8'

services:
  credit-iq:
    build:
      context: ..
      dockerfile: Dockerfile
    image: credit-iq:latest
    container_name: credit_iq_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=50
    volumes:
      - credit_iq_cases:/app/cases
      - credit_iq_reports:/app/reports
      - credit_iq_data:/app/data
    networks:
      - internal_net
    expose:
      - "8501"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  nginx:
    image: nginx:alpine
    container_name: credit_iq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - credit-iq
    networks:
      - internal_net

volumes:
  credit_iq_cases:
  credit_iq_reports:
  credit_iq_data:
  certbot_www:

networks:
  internal_net:
    driver: bridge
